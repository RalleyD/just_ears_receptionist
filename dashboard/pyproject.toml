[project]
name = "dashboard"
version = "0.1.0"
description = "Client-facing call analytics dashboard for Just Ears"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40.0",
    "plotly>=5.24.0",
    "twilio>=9.0.0",
    "python-dotenv>=1.0.0",
    "pandas<=2.2.3",
    "requests",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
